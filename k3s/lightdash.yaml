apiVersion: apps/v1
kind: Deployment
metadata:
  name: lightdash
  namespace: default
  labels:
    app: lightdash
spec:
  replicas: 1
  selector:
    matchLabels:
      app: lightdash
  template:
    metadata:
      labels:
        app: lightdash
    spec:
      containers:
        - name: lightdash
          image: lightdash/lightdash:0.1575.0
          imagePullPolicy: IfNotPresent
          env:
            - name: PORT
              value: "8080"
            - name: LIGHTDASH_SECRET
              value: "supersecretdevelopmentkeyforlightdash123!"
            - name: SECURE_COOKIES
              value: "false"
            - name: PGCONNECTIONURI
              value: "postgresql://postgres:postgresadmin@postgres:5432/metadata"
            - name: LIGHTDASH_INSTALLATION_ID
              value: "project-sandbox-local"
            - name: S3_ENDPOINT
              value: "http://minio:9000"
            - name: S3_BUCKET
              value: "data-lakehouse"
            - name: S3_REGION
              value: "us-east-1"
            - name: S3_ACCESS_KEY
              value: "minioadmin"
            - name: S3_SECRET_KEY
              value: "minioadmin"
            - name: S3_FORCE_PATH_STYLE
              value: "true"
          ports:
            - containerPort: 8080
              name: http
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            limits:
              cpu: "1"
              memory: 1.5Gi
            requests:
              cpu: "250m"
              memory: 512Mi
          volumeMounts:
            - mountPath: /app/data
              name: duckdb-volume
      volumes:
        - name: duckdb-volume
          persistentVolumeClaim:
            claimName: duckdb-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: lightdash
  namespace: default
  labels:
    app: lightdash
spec:
  type: LoadBalancer
  ports:
    - port: 8080
      targetPort: 8080
  selector:
    app: lightdash
