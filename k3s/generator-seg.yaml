apiVersion: apps/v1
kind: Deployment
metadata:
  name: generator-seg
  namespace: default
  labels:
    app: generator-seg
spec:
  replicas: 1
  selector:
    matchLabels:
      app: generator-seg
  template:
    metadata:
      labels:
        app: generator-seg
    spec:
      initContainers:
        - name: wait-for-redpanda
          image: rancher/mirrored-library-busybox:1.36.1
          imagePullPolicy: IfNotPresent
          command: ["sh", "-c", "until nc -z redpanda 19092; do echo waiting for redpanda; sleep 2; done"]
        - name: fix-app-permissions
          image: rancher/mirrored-library-busybox:1.36.1
          imagePullPolicy: IfNotPresent
          command: ["sh", "-c", "chmod -R 755 /app 2>/dev/null || true"]
          volumeMounts:
            - mountPath: /app
              name: app-volume
      containers:
        - name: generator-seg
          image: ghcr.io/astral-sh/uv:python3.13-bookworm-slim
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-c"]
          args:
            - |
              cd /app
              uv sync
              uv run python src/generator.py --continuous --domain seg
          env:
            - name: UV_PROJECT_ENVIRONMENT
              value: /app/data/.venv
            - name: REDPANDA_BROKERS
              value: "redpanda:19092"
            - name: MINIO_ENDPOINT
              value: "http://minio:9000"
            - name: MINIO_ACCESS_KEY
              value: "minioadmin"
            - name: MINIO_SECRET_KEY
              value: "minioadmin"
            - name: GENERATOR_RATE_ROWS_PER_SEC
              value: "500"
            - name: GENERATOR_BATCH_INTERVAL_SEC
              value: "2"
            - name: GENERATOR_SEG_EVENT_CYCLE_HOURS
              value: "3"
          volumeMounts:
            - mountPath: /app
              name: app-volume
      volumes:
        - name: app-volume
          # hostPath is mapped by scripts/create_cluster.sh which bind-mounts
          # the repo root to /workspace/de-for-fun inside the k3d server container.
          # This makes the manifest portable — the repo can live anywhere on the host.
          hostPath:
            path: /workspace/de-for-fun
            type: Directory
