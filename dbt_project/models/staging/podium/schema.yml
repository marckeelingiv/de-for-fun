version: 2

models:
  - name: stg_interaction_events
    description: "Staged Podium merchant/customer interaction events with derived time and channel classification columns."
    columns:
      - name: tenant_id
        tests: [not_null]
      - name: interaction_id
        tests: [not_null, unique]
      - name: merchant_id
        tests: [not_null]
      - name: timestamp
        tests: [not_null]

  - name: stg_ai_telemetry
    description: "Staged Podium AI telemetry with derived token totals, SLA status, and sentiment categorization."
    columns:
      - name: tenant_id
        tests: [not_null]
      - name: interaction_id
        tests: [not_null]
      - name: total_tokens
        tests: [not_null]
      - name: sla_status
        tests: [not_null]
