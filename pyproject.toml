[project]
name = "de-for-fun"
version = "0.1.0"
description = "Local-first decoupled storage & compute data engineering stack with MinIO, DuckDB, dbt, Dagster, and Lightdash"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "aiokafka>=0.12.0",
    "polars>=0.20.0",
    "pyarrow>=15.0.0",
    "minio>=7.2.0",
    "s3fs>=2024.3.0",
    "dagster>=1.6.0",
    "dagster-webserver>=1.6.0",
    "dbt-core>=1.7.0",
    "dbt-duckdb>=1.7.0",
    "duckdb>=1.0.0",
    "fastmcp>=0.1.0",
]
